name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: src/InputLockTimer/InputLockTimer.csproj
  TEST_PROJECT: tests/InputLockTimer.Tests/InputLockTimer.Tests.csproj
  DOTNET_VERSION: 8.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release

      - name: Publish single-file exe
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          --output publish

      - name: Create checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No exe found in publish/" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "publish/$($exe.Name).sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputLockTimer-win-x64
          path: |
            publish/*.exe
            publish/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    # v* 태그를 푸시했을 때만 GitHub Release에 exe를 첨부합니다.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: InputLockTimer-win-x64
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
